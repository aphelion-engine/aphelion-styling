[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion-styling"
version = "0.1.0"
description = "Reusable Qt6 styling and icon primitives for Aphelion applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
